name: CI

on:
  pull_request:
    branches:
      - 'master'

jobs:
  ci:
    strategy:
      matrix:
        runs_on:
          - ubicloud-standard-30
          - ubicloud-standard-30-arm
        variant:
          - default
          - full
          - slim
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=static-ffmpeg-ci-${{ matrix.runs_on }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=static-ffmpeg-ci-${{ matrix.runs_on }}-${{ matrix.variant }}
          build-args: |
            BUILD_VARIANT=${{ matrix.variant }}
            ENABLE_FDKAAC=1
