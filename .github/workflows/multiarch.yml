name: Multi arch build

on:
  push:
    branches:
      - "master"
    tags:
      - "**"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/hugefiver/static-ffmpeg

jobs:
  build-base:
    name: Build shared base (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    needs:
      - tag

    timeout-minutes: 360
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build shared dependency base
        timeout-minutes: 360
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ffmpeg-build-base
          push: false
          labels: runnumber=${{ github.run_id }}
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
          cache-to: type=gha,mode=max,scope=static-ffmpeg-${{ matrix.arch }}-shared

      # - name: Docker save
      #   run: docker image save --output image-${{ matrix.arch }}.tar ${{ env.REGISTRY_IMAGE }}:${{ needs.tag.outputs.TAG }}-${{ matrix.arch }}

      # - name: Upload Docker image-${{ matrix.arch }}
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: image-${{ matrix.arch }}
      #     path: image-${{ matrix.arch }}.tar
      #     retention-days: 1

  build-variant:
    name: Build image (${{ matrix.arch }}, ${{ matrix.variant }})
    needs:
      - build-base
      - tag
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        variant:
          - default
          - full
          - slim
          - shared
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    timeout-minutes: 360
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Docker tags
        id: tags
        env:
          TAG: ${{ needs.tag.outputs.TAG }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          {
            echo 'tags<<EOF'
            if [ "$VARIANT" = default ]; then
              echo "${REGISTRY_IMAGE}:${TAG}-${ARCH}"
            elif [ "$TAG" = latest ]; then
              echo "${REGISTRY_IMAGE}:${VARIANT}-${ARCH}"
            else
              echo "${REGISTRY_IMAGE}:${TAG}-${VARIANT}-${ARCH}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Upload static variant
        if: ${{ matrix.variant != 'shared' }}
        id: docker_build_static
        timeout-minutes: 360
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
          build-args: |
            BUILD_VARIANT=${{ matrix.variant }}

      - name: Build and Upload shared
        if: ${{ matrix.variant == 'shared' }}
        id: docker_build_shared
        timeout-minutes: 360
        uses: docker/build-push-action@v7
        with:
          context: .
          target: shared
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared

  merge:
    name: Merge and push images
    runs-on: ubuntu-latest
    needs:
      - build-variant
      - tag
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        env:
          TAG: ${{ needs.tag.outputs.TAG }}
        run: |
          set -eu

          docker manifest create "${REGISTRY_IMAGE}:${TAG}" \
            --amend "${REGISTRY_IMAGE}:${TAG}-amd64" \
            --amend "${REGISTRY_IMAGE}:${TAG}-arm64"
          docker manifest push "${REGISTRY_IMAGE}:${TAG}"

          if [ "$TAG" = latest ]; then
            FULL_TAG=full
            SLIM_TAG=slim
            SHARED_TAG=shared
          else
            FULL_TAG="${TAG}-full"
            SLIM_TAG="${TAG}-slim"
            SHARED_TAG="${TAG}-shared"
          fi

          docker manifest create "${REGISTRY_IMAGE}:${FULL_TAG}" \
            --amend "${REGISTRY_IMAGE}:${FULL_TAG}-amd64" \
            --amend "${REGISTRY_IMAGE}:${FULL_TAG}-arm64"
          docker manifest push "${REGISTRY_IMAGE}:${FULL_TAG}"

          docker manifest create "${REGISTRY_IMAGE}:${SLIM_TAG}" \
            --amend "${REGISTRY_IMAGE}:${SLIM_TAG}-amd64" \
            --amend "${REGISTRY_IMAGE}:${SLIM_TAG}-arm64"
          docker manifest push "${REGISTRY_IMAGE}:${SLIM_TAG}"

          docker manifest create "${REGISTRY_IMAGE}:${SHARED_TAG}" \
            --amend "${REGISTRY_IMAGE}:${SHARED_TAG}-amd64" \
            --amend "${REGISTRY_IMAGE}:${SHARED_TAG}-arm64"
          docker manifest push "${REGISTRY_IMAGE}:${SHARED_TAG}"

  tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.result }}
    steps:
      - name: Extract the tag name
        id: tag
        run: |
          jq -nr '
            ( env.GITHUB_REF # refs/heads|tags/abc
            | split("/")[1:]
            | "result=" + if . == ["heads","master"] then "latest" else .[1] end
            )
          ' >> "$GITHUB_OUTPUT"

