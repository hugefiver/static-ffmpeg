name: Multi arch build

on:
  push:
    branches:
      - "master"
    tags:
      - "**"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/hugefiver/static-ffmpeg

jobs:
  build-multiarch:
    name: Build image
    strategy:
      matrix:
        arch: [amd64]

    needs:
      - tag

    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Upload
        id: docker_build
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.tag.outputs.TAG }}-${{ matrix.arch }},${{ env.REGISTRY_IMAGE }}:${{ needs.tag.outputs.TAG }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Docker save
      #   run: docker image save --output image-${{ matrix.arch }}.tar ${{ env.REGISTRY_IMAGE }}:${{ needs.tag.outputs.TAG }}-${{ matrix.arch }}

      # - name: Upload Docker image-${{ matrix.arch }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: image-${{ matrix.arch }}
      #     path: image-${{ matrix.arch }}.tar
      #     retention-days: 1

  tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.result }}
    steps:
      - name: Extract the tag name
        id: tag
        run: |
          jq -nr '
            ( env.GITHUB_REF # refs/heads|tags/abc
            | split("/")[1:]
            | "result=" + if . == ["heads","master"] then "latest" else .[1] end
            )
          ' >> "$GITHUB_OUTPUT"

