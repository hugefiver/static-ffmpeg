name: Multi arch build

on:
  push:
    branches:
      - "master"
    tags:
      - "**"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/hugefiver/static-ffmpeg

jobs:
  build-multiarch:
    name: Build image
    strategy:
      matrix:
        arch: [amd64]

    needs:
      - tag

    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Docker tags default
        id: tags_default
        env:
          TAG: ${{ needs.tag.outputs.TAG }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${REGISTRY_IMAGE}:${TAG}-${ARCH}"
            echo "${REGISTRY_IMAGE}:${TAG}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker tags full
        id: tags_full
        env:
          TAG: ${{ needs.tag.outputs.TAG }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo 'tags<<EOF'
            if [ "$TAG" = latest ]; then
              echo "${REGISTRY_IMAGE}:full-${ARCH}"
              echo "${REGISTRY_IMAGE}:full"
            else
              echo "${REGISTRY_IMAGE}:${TAG}-full-${ARCH}"
              echo "${REGISTRY_IMAGE}:${TAG}-full"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker tags slim
        id: tags_slim
        env:
          TAG: ${{ needs.tag.outputs.TAG }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo 'tags<<EOF'
            if [ "$TAG" = latest ]; then
              echo "${REGISTRY_IMAGE}:slim-${ARCH}"
              echo "${REGISTRY_IMAGE}:slim"
            else
              echo "${REGISTRY_IMAGE}:${TAG}-slim-${ARCH}"
              echo "${REGISTRY_IMAGE}:${TAG}-slim"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build shared dependency base
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ffmpeg-build-base
          push: false
          labels: runnumber=${{ github.run_id }}
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
          cache-to: type=gha,mode=max,scope=static-ffmpeg-${{ matrix.arch }}-shared

      - name: Build and Upload default
        id: docker_build_default
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags_default.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: |
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-default
          cache-to: type=gha,mode=max,scope=static-ffmpeg-${{ matrix.arch }}-default
          build-args: |
            BUILD_VARIANT=default

      - name: Build and Upload full
        id: docker_build_full
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags_full.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: |
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-full
          cache-to: type=gha,mode=max,scope=static-ffmpeg-${{ matrix.arch }}-full
          build-args: |
            BUILD_VARIANT=full

      - name: Build and Upload slim
        id: docker_build_slim
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags_slim.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          load: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          cache-from: |
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-shared
            type=gha,scope=static-ffmpeg-${{ matrix.arch }}-slim
          cache-to: type=gha,mode=max,scope=static-ffmpeg-${{ matrix.arch }}-slim
          build-args: |
            BUILD_VARIANT=slim

      # - name: Docker save
      #   run: docker image save --output image-${{ matrix.arch }}.tar ${{ env.REGISTRY_IMAGE }}:${{ needs.tag.outputs.TAG }}-${{ matrix.arch }}

      # - name: Upload Docker image-${{ matrix.arch }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: image-${{ matrix.arch }}
      #     path: image-${{ matrix.arch }}.tar
      #     retention-days: 1

  tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.result }}
    steps:
      - name: Extract the tag name
        id: tag
        run: |
          jq -nr '
            ( env.GITHUB_REF # refs/heads|tags/abc
            | split("/")[1:]
            | "result=" + if . == ["heads","master"] then "latest" else .[1] end
            )
          ' >> "$GITHUB_OUTPUT"

